[project]
name = "wildhat"
version = "0.1.0"
description = "Team 100 Wildhat AI command-line tool: sign in to the team's Google Cloud project"
readme = "README.md"
requires-python = ">=3.10"
# Standard library only. Keep it that way so installs work on any laptop.
dependencies = []

[project.scripts]
wildhat = "wildhat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wildhat"]

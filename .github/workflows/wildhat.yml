name: wildhat CLI tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai/wildhat/**'
      - '.github/workflows/wildhat.yml'
  pull_request:
    paths:
      - 'ai/wildhat/**'
      - '.github/workflows/wildhat.yml'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest Python wildhat supports, and the newest.
        python-version: ['3.10', '3.14']

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: ./ai/wildhat

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Standard library only: nothing to install to run the tests.
      - run: python -m unittest discover -s tests -v

      # The package installs and its `wildhat` command starts.
      - run: python -m pip install .
      - run: wildhat --version

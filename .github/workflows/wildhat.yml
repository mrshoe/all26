name: wildhat tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai/wildhat/**'
      - 'ai/terraform/functions/**'
      - 'ai/terraform/jobs.tf'
      - 'ai/images/**'
      - '.github/workflows/wildhat.yml'
      - '.github/scripts/annotate_unittest_failures.py'
  pull_request:
    paths:
      - 'ai/wildhat/**'
      - 'ai/terraform/functions/**'
      - 'ai/terraform/jobs.tf'
      - 'ai/images/**'
      - '.github/workflows/wildhat.yml'
      - '.github/scripts/annotate_unittest_failures.py'

jobs:
  cli:
    name: CLI (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest Python wildhat supports, and the newest.
        python-version: ['3.10', '3.14']

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: ./ai/wildhat

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Standard library only: nothing to install to run the tests.
      - name: Run tests
        shell: bash
        run: python -m unittest discover -s tests -v 2>&1 | tee test-output.txt

      - name: Annotate failures
        if: failure()
        shell: bash
        run: python ../../.github/scripts/annotate_unittest_failures.py test-output.txt

      # The package installs and its `wildhat` command starts.
      - run: python -m pip install .
      - run: wildhat --version

  watchdog:
    name: Job watchdog function
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ai/terraform/functions

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # The function's runtime, python313 in ai/terraform/guardrails.tf.
          python-version: '3.13'

      - name: Run tests
        shell: bash
        run: python -m unittest discover -s tests -v 2>&1 | tee test-output.txt

      - name: Annotate failures
        if: failure()
        shell: bash
        run: python ../../../.github/scripts/annotate_unittest_failures.py test-output.txt

  images:
    name: Base image entrypoint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ai/images

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # The image's Python (ai/images/base/Dockerfile).
          python-version: '3.11'

      - name: Run tests
        shell: bash
        run: python -m unittest discover -s tests -v 2>&1 | tee test-output.txt

      - name: Annotate failures
        if: failure()
        shell: bash
        run: python ../../.github/scripts/annotate_unittest_failures.py test-output.txt

name: wildhat CLI tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai/wildhat/**'
      - '.github/workflows/wildhat.yml'
  pull_request:
    paths:
      - 'ai/wildhat/**'
      - '.github/workflows/wildhat.yml'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest Python wildhat supports, and the newest.
        python-version: ['3.10', '3.14']

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: ./ai/wildhat

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Standard library only: nothing to install to run the tests.
      - name: Run tests
        shell: bash
        run: python -m unittest discover -s tests -v 2>&1 | tee test-output.txt

      # Each failing test's traceback, as an annotation on the run's summary.
      - name: Annotate failures
        if: failure()
        shell: bash
        run: |
          python - <<'EOF'
          import re

          def escape(text, *extra):
              for char in ("%", "\r", "\n", *extra):
                  text = text.replace(char, f"%{ord(char):02X}")
              return text

          output = open("test-output.txt", encoding="utf-8").read()
          for block in output.split("=" * 70 + "\n")[1:]:
              title, _, body = block.partition("-" * 70 + "\n")
              body = re.split(r"\n-{70}\n", body)[0]
              print(f"::error title={escape(title.strip(), ':', ',')}::{escape(body.strip())}")
          EOF

      # The package installs and its `wildhat` command starts.
      - run: python -m pip install .
      - run: wildhat --version
